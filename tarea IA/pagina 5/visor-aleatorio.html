<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Dibujo // Generador Aleatorio</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos específicos para la Mesa de Dibujo */
        .workspace {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 4rem);
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* Panel Superior Flotante: Controles */
        .toolbar {
            background: var(--bg-moss);
            border-radius: var(--leaf-radius-alt);
            padding: 1.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-leaf);
            box-shadow: var(--shadow-forest);
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .select-organic {
            background: var(--bg-leaf-surface);
            color: var(--text-light);
            border: 1px solid var(--border-leaf);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        
        .select-organic option {
            background: var(--bg-forest-deep);
        }

        /* Módulo Central: Visor */
        .viewer-container {
            flex: 1;
            position: relative;
            background: var(--bg-leaf-surface);
            border: 2px solid var(--border-leaf);
            border-radius: 5px; /* Ligeramente irregular via clip-path si se desea, pero preferimos mantener proporciones precisas para el artista */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), var(--shadow-forest);
        }
        
        .viewer-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 8px solid rgba(42, 71, 52, 0.4); /* Textura de marco sutil */
            mix-blend-mode: overlay;
        }

        #reference-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        /* Lienzo oculto o superpuesto para efectos de Canvas (Fase 4) */
        #canvas-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            pointer-events: none; /* Dejar que los clics pasen a la imagen, si es necesario */
            z-index: 10;
        }

        /* Rejilla CSS para la cuadrícula espacial */
        .grid-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; /* Se ajustará vía JS a las dimensiones exactas de la imagen */
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--accent-sprout) 1px, transparent 1px),
                linear-gradient(to bottom, var(--accent-sprout) 1px, transparent 1px);
            background-size: 33.333% 33.333%; /* Rejilla de tercios por defecto */
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .grid-overlay.active {
            opacity: 0.6;
        }

        /* Panel Inferior: Metadatos */
        .metadata-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 27, 18, 0.9);
            backdrop-filter: blur(5px);
            padding: 1.5rem 2.5rem;
            border-radius: var(--leaf-radius);
            border: 1px solid var(--border-leaf);
            box-shadow: var(--shadow-forest);
            text-align: center;
            max-width: 80%;
            z-index: 30;
            transition: opacity 0.3s ease;
        }

        .meta-title {
            color: var(--accent-spore);
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .meta-tags {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .meta-advice {
            font-size: 1.05rem;
            color: var(--text-light);
            font-style: italic;
        }

        .timer-display {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--accent-spore);
            font-weight: bold;
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
        }

        /* Elementos de la Suite de Análisis visual (Se habilitan funcionalmente en Fase 4) */
        .btn-tool {
            background: var(--bg-forest-deep);
            color: var(--text-muted);
            border: 1px solid var(--border-leaf);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-tool:hover {
            color: var(--accent-sprout);
            border-color: var(--accent-sprout);
        }

        .btn-tool.active {
            background: var(--accent-sprout);
            color: var(--bg-forest-deep);
            border-color: var(--accent-sprout);
        }

        /* Notificador de cambio */
        .aria-live-region {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
        
        @media (max-width: 1024px) {
            .workspace {
                height: auto;
                min-height: calc(100vh - 100px);
            }
            .viewer-container {
                min-height: 50vh;
                margin-bottom: 2rem;
            }
            .metadata-panel {
                position: relative;
                bottom: 0;
                transform: none;
                left: 0;
                max-width: 100%;
                margin-bottom: 2rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Menú Lateral -->
    <aside id="forest-sidebar" aria-label="Menú de Navegación Principal">
        <div class="sidebar-brand" tabindex="0" aria-label="Expandir menú">
            <div class="totem-icon" aria-hidden="true">𖥸</div>
            <span class="brand-text">SYLVA</span>
        </div>
        <nav class="sidebar-nav" aria-label="Secciones del Bosque">
            <a href="index.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true">🌱</span>
                <span class="nav-text">[ 01 // CLARO DEL BOSQUE ]</span>
            </a>
            <a href="visor-aleatorio.html" class="nav-item active" aria-current="page">
                <span class="nav-icon" aria-hidden="true">🌀</span>
                <span class="nav-text">[ 02 // GENERADOR DE REFERENCIAS ]</span>
            </a>
            <a href="galeria-mosaico.html" class="nav-item">
                <span class="nav-icon" aria-hidden="true">🌿</span>
                <span class="nav-text">[ 03 // HERBARIO COMPLETO ]</span>
            </a>
        </nav>
    </aside>

    <main id="main-content">
        <div class="workspace">
            
            <!-- Barra de Controles -->
            <div class="toolbar" role="toolbar" aria-label="Controles de Artista">
                <div class="tool-group">
                    <button id="btn-randomize" class="btn-organic" aria-label="Cargar nueva referencia aleatoria">
                        <span aria-hidden="true">🌀</span> NUEVA REFERENCIA
                    </button>
                    <select id="category-filter" class="select-organic" aria-label="Filtrar por categoría">
                        <option value="all">Todo el Bosque</option>
                        <option value="corteza">Solo Árboles y Troncos</option>
                        <option value="macro">Flores y Macroflora</option>
                        <option value="fauna">Criaturas del Bosque</option>
                        <option value="paisaje">Paisajes y Vistas Profundas</option>
                    </select>
                </div>
                
                <div class="tool-group">
                    <select id="timer-select" class="select-organic" aria-label="Temporizador de Práctica">
                        <option value="0">Práctica Libre</option>
                        <option value="60">1 Minuto (Gestual)</option>
                        <option value="300">5 Minutos (Encaje)</option>
                        <option value="900">15 Minutos (Sombreado)</option>
                    </select>
                    <div id="timer-display" class="timer-display" aria-live="polite">--:--</div>
                </div>

                <!-- Botones de Análisis Visual (Fase 4 implementará lógica en canvas-tools.js) -->
                <div class="tool-group">
                    <button id="btn-grayscale" class="btn-tool" aria-pressed="false" aria-label="Alternar escala de grises y claroscuro">
                        Claroscuro (B/N)
                    </button>
                    <button id="btn-grid" class="btn-tool" aria-pressed="false" aria-label="Alternar rejilla de proporción">
                        Cuadrícula 3x3
                    </button>
                    <button id="btn-flip" class="btn-tool" aria-pressed="false" aria-label="Espejo horizontal">
                        Espejo ↔
                    </button>
                </div>
            </div>

            <!-- Visor Central -->
            <div class="viewer-container" id="viewer">
                <img id="reference-image" src="" alt="Imagen de referencia cargando" style="display: none;">
                <!-- Overlay Canvas para Filtros Complejos (Fase 4) -->
                <canvas id="canvas-overlay"></canvas>
                <!-- Overlay Rejilla de Proporción -->
                <div id="grid-overlay" class="grid-overlay" aria-hidden="true"></div>
            </div>

            <!-- Metadatos de la Imagen -->
            <div class="metadata-panel" id="metadata-panel">
                <h2 id="meta-title" class="meta-title">Cargando Referencia...</h2>
                <div class="meta-tags">
                    Nivel: <span id="meta-complexity">--</span> | Foco: <span id="meta-focus">--</span>
                </div>
                <p id="meta-advice" class="meta-advice">Afila tus lápices, el bosque te aguarda.</p>
            </div>
            
            <!-- Accesibilidad: Región Viva -->
            <div id="live-announcer" class="aria-live-region" aria-live="assertive"></div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="js/navigation.js"></script>
    <script src="js/forest-data.js"></script>
    <script src="js/randomizer-engine.js"></script>
    <script src="js/canvas-tools.js"></script>
</body>
</html>
