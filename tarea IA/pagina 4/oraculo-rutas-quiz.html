<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo de Rutas | Hyrule Chronicles</title>
    <meta name="description" content="Responde al oráculo y descubre tu ruta ideal para introducirte en la leyenda de Zelda sin fricciones mecánicas.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header is injected via main.js -->

    <main class="container" style="max-width: 900px;">
        <header style="text-align: center; margin-bottom: 3rem;">
            <svg viewBox="0 0 100 100" width="80" height="80" style="fill: var(--blue-sheikah); filter: drop-shadow(0 0 10px var(--blue-sheikah)); margin-bottom: 1rem;">
                <!-- Ojo Sheikah Simplificado -->
                <path d="M50,30 Q80,30 90,50 Q80,70 50,70 Q20,70 10,50 Q20,30 50,30 Z" fill="none" stroke="currentColor" stroke-width="4"/>
                <circle cx="50" cy="50" r="10" fill="currentColor"/>
                <path d="M50,70 L50,90" fill="none" stroke="currentColor" stroke-width="4"/>
                <path d="M40,80 L40,85" fill="none" stroke="currentColor" stroke-width="4"/>
                <path d="M60,80 L60,85" fill="none" stroke="currentColor" stroke-width="4"/>
                <path d="M40,15 Q50,5 60,15" fill="none" stroke="currentColor" stroke-width="4"/>
            </svg>
            <h2 style="font-size: 2.5rem; color: var(--blue-sheikah);">El Oráculo de Rutas</h2>
            <p style="color: var(--text-parchment); max-width: 600px; margin: 0 auto;">El gran archivo histórico es inmenso y abrumador. Si no sabes por dónde comenzar tu aventura, permite que el Oráculo evalúe tu afinidad y te asigne una ruta lógica de progresión que respete tu tolerancia mecánica y gustos.</p>
        </header>

        <!-- Barra de Progreso del Quiz -->
        <div style="width: 100%; height: 4px; background: var(--bg-card); border-radius: 2px; margin-bottom: 3rem; overflow: hidden;">
            <div id="quizProgress" style="width: 0%; height: 100%; background: var(--blue-sheikah); transition: width 0.4s ease; box-shadow: 0 0 10px var(--blue-sheikah);"></div>
        </div>

        <!-- Contenedor Dinámico del Quiz -->
        <section id="quizContainer" style="min-height: 400px; position: relative;">
            <!-- Renderizado dinámico vía quiz-engine.js -->
        </section>

    </main>

    <script src="js/main.js"></script>
    <script src="js/quiz-engine.js"></script>
</body>
</html>
