<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Tracker | Guía de Episodios y Relleno</title>
    <meta name="description" content="Rastreador de episodios de anime, guías de relleno y progreso.">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1><span class="highlight">NEO</span> TRACKER</h1>
            <div class="marathon-control">
                <span class="marathon-label">MODO MARATÓN</span>
                <label class="switch">
                    <input type="checkbox" id="marathon-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </header>

    <main class="main-content">
        <aside class="sidebar">
            <div class="panel">
                <h2>FILTROS</h2>
                <div class="filters" id="filters-container">
                    <!-- Filters will be generated here -->
                </div>
            </div>
            
            <div class="panel stats-panel">
                <h2>PROGRESO TOTAL</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="global-progress"></div>
                </div>
                <div class="stats-text" id="global-stats-text">0 / 0 Episodios</div>
            </div>
        </aside>

        <section class="content-area">
            <div id="arcs-container" class="arcs-container">
                <!-- Arcs will be generated here -->
            </div>
        </section>
    </main>

    <!-- Modal for episode details -->
    <div id="episode-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" id="modal-close">&times;</button>
            <div class="modal-header">
                <span id="modal-badge" class="badge">CANON</span>
                <h2 id="modal-title">Título del Episodio</h2>
                <span id="modal-ep-number">EP. 0</span>
            </div>
            <div class="modal-body">
                <div class="info-row">
                    <span class="info-label">Emisión:</span>
                    <span id="modal-date" class="info-value">2024-01-01</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Introduce a:</span>
                    <span id="modal-introduces" class="info-value highlight-text">Personaje</span>
                </div>
                <div class="synopsis-box">
                    <h3>SINOPSIS</h3>
                    <p id="modal-synopsis">Texto de sinopsis...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-watch-btn" class="action-btn">MARCAR COMO VISTO</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
