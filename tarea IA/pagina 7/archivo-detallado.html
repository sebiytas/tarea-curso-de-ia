<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophy Vault | Archivo Enciclopédico de Logros</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ==========================================================================
           ESTILOS DEL ARCHIVO DETALLADO (VITRINAS)
           ========================================================================== */
        .archive-controls {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 3rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .vitrine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 5rem;
            padding: 0 1rem;
        }

        .vitrine-card {
            background: linear-gradient(180deg, #161922 0%, #0B0D11 100%);
            border: 1px solid var(--border-metal);
            border-radius: 8px 8px 4px 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
        }

        .vitrine-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(255, 208, 52, 0.15);
            border-color: var(--gold-shadow);
        }

        .vitrine-header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            border-bottom: 2px solid rgba(255, 208, 52, 0.2);
            position: relative;
            background: radial-gradient(circle at top center, rgba(255,255,255,0.05), transparent 80%);
        }

        .vitrine-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 8px 20px rgba(0,0,0,0.6);
            background: var(--bg-pedestal);
            position: relative;
        }

        /* Temática de Presea */
        .vitrine-card[data-level="platinum"] .vitrine-icon { border: 3px solid var(--metal-platinum); color: var(--metal-platinum); text-shadow: 0 0 15px rgba(229, 228, 226, 0.6); }
        .vitrine-card[data-level="gold"] .vitrine-icon { border: 3px solid var(--gold-trophy); color: var(--gold-trophy); text-shadow: 0 0 15px rgba(255, 208, 52, 0.6); }
        .vitrine-card[data-level="silver"] .vitrine-icon { border: 3px solid var(--metal-silver); color: var(--metal-silver); text-shadow: 0 0 15px rgba(226, 232, 240, 0.6); }
        .vitrine-card[data-level="bronze"] .vitrine-icon { border: 3px solid var(--metal-bronze); color: var(--metal-bronze); text-shadow: 0 0 15px rgba(205, 127, 50, 0.6); }

        .vitrine-card[data-level="platinum"] .vitrine-header { border-bottom-color: rgba(229, 228, 226, 0.3); }
        .vitrine-card[data-level="gold"] .vitrine-header { border-bottom-color: rgba(255, 208, 52, 0.3); }
        .vitrine-card[data-level="silver"] .vitrine-header { border-bottom-color: rgba(226, 232, 240, 0.3); }
        .vitrine-card[data-level="bronze"] .vitrine-header { border-bottom-color: rgba(205, 127, 50, 0.3); }

        .vitrine-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--gold-sheen);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .vitrine-champion {
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--text-pure);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .vitrine-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .vitrine-category {
            align-self: flex-start;
            background: rgba(47, 54, 74, 0.6);
            border: 1px solid var(--border-metal);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .vitrine-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            background: rgba(0,0,0,0.3);
            padding: 1.25rem;
            border-radius: 4px;
            border-left: 2px solid var(--border-metal);
            flex: 1;
        }

        .vitrine-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-metal);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f1118;
        }

        .vitrine-date {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }

        .btn-print {
            background: transparent;
            color: var(--gold-sheen);
            border: 1px solid var(--border-metal);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-print:hover {
            background: rgba(255, 208, 52, 0.1);
            border-color: var(--gold-trophy);
            color: var(--gold-sheen);
        }

        /* ==========================================================================
           MODO IMPRESIÓN / CERTIFICADO (CÓDIGO DE IMPRESIÓN LIMPIA)
           ========================================================================== */
        @media print {
            body > *:not(#print-container) {
                display: none !important;
            }
            body {
                background: #fff !important;
                background-image: none !important;
                margin: 0;
                padding: 0;
            }
            #print-container {
                display: block !important;
            }
            .certificate-mode {
                width: 100%;
                height: 100vh;
                background: #fdfbf7;
                color: #222;
                padding: 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                border: 20px solid #1a1a1a;
                box-sizing: border-box;
                position: relative;
            }
            .certificate-mode::before {
                content: '';
                position: absolute;
                inset: 5px;
                border: 2px solid #b8860b;
                pointer-events: none;
            }
            .certificate-mode h1 { 
                font-family: 'Cinzel', serif; 
                font-size: 3.5rem; 
                margin-bottom: 30px; 
                color: #1a1a1a;
                letter-spacing: 4px;
            }
            .certificate-mode h2 { 
                font-family: 'Cinzel', serif; 
                font-size: 1.5rem; 
                color: #555; 
                letter-spacing: 2px;
            }
            .certificate-mode .champion-name {
                font-family: 'Cinzel', serif; 
                font-size: 3rem; 
                color: #b8860b; 
                margin: 20px 0;
                font-weight: bold;
            }
            .certificate-mode h3 { 
                font-family: 'Cinzel', serif; 
                font-size: 2rem; 
                margin-top: 30px;
                color: #333;
            }
            .certificate-mode p.desc { 
                font-family: 'Outfit', sans-serif; 
                font-size: 1.2rem; 
                max-width: 800px; 
                margin: 20px auto; 
                font-style: italic;
                color: #444;
                line-height: 1.6;
            }
            .certificate-mode .cert-seal { 
                width: 150px; 
                height: 150px; 
                border-radius: 50%; 
                border: 8px double #b8860b; 
                margin: 40px auto; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                font-family: 'Cinzel', serif; 
                font-size: 4rem; 
                background: #fff9e6;
                color: #b8860b;
            }
            .certificate-mode .cert-date { 
                font-family: 'Fira Code', monospace; 
                margin-top: auto; 
                font-size: 1.2rem;
                color: #666;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero-section">
            <h2 class="hero-title">Archivo Enciclopédico</h2>
            <p class="hero-subtitle">Bitácora exhaustiva de cada hito histórico registrado. Explora los detalles y exporta los certificados de victoria.</p>
        </section>

        <!-- Controles de Archivo -->
        <section class="archive-controls">
            <div class="form-group" style="flex: 1;">
                <input type="text" id="archive-search" class="engraved-input" placeholder="Filtrar archivos por campeón, disciplina o palabra clave..." aria-label="Buscador del archivo">
            </div>
            <button id="btn-clear-filters" class="btn-action" style="max-width: 150px;">Resetear</button>
        </section>

        <!-- Grilla de Vitrinas -->
        <section id="vitrine-container" class="vitrine-grid" aria-label="Catálogo de Trofeos">
            <!-- Renderizado Dinámico vía JS -->
        </section>
    </main>

    <!-- Contenedor Oculto para Inyectar Certificado de Impresión -->
    <div id="print-container" style="display: none;"></div>

    <script src="js/main.js"></script>
    <script src="js/trophy-storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('vitrine-container');
            const searchInput = document.getElementById('archive-search');
            const btnClear = document.getElementById('btn-clear-filters');
            let allTrophies = TrophyStorage.getTrophies();
            
            // Ordenamos por defecto: Más recientes primero
            allTrophies.sort((a,b) => new Date(b.date) - new Date(a.date));

            // Filtro automático desde URL (Ej: Redirección desde Leaderboard)
            const params = new URLSearchParams(window.location.search);
            const userFilter = params.get('user');
            if (userFilter) {
                searchInput.value = userFilter;
            }

            function getMedalIcon(level) {
                switch(level) {
                    case 'platinum': return '💎';
                    case 'gold': return '🏆';
                    case 'silver': return '🥈';
                    case 'bronze': return '🥉';
                    default: return '🏅';
                }
            }

            function renderTrophies(filterText) {
                container.innerHTML = '';
                
                const filtered = allTrophies.filter(t => {
                    const str = `${t.champion} ${t.title} ${t.category} ${t.description}`.toLowerCase();
                    return str.includes(filterText.toLowerCase());
                });

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 4rem; background: var(--bg-glass); border-radius: 8px; border: 1px dashed var(--border-metal);">
                            <p style="color: var(--text-muted); font-size: 1.1rem;">No se hallaron archivos que coincidan con la búsqueda.</p>
                        </div>`;
                    return;
                }

                filtered.forEach(t => {
                    const card = document.createElement('article');
                    card.className = 'vitrine-card';
                    card.setAttribute('data-level', t.level);

                    const dateObj = new Date(t.date);
                    const dateStr = dateObj.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

                    card.innerHTML = `
                        <div class="vitrine-header">
                            <div class="vitrine-icon" aria-hidden="true">${getMedalIcon(t.level)}</div>
                            <h3 class="vitrine-title">${t.title}</h3>
                            <div class="vitrine-champion">${t.champion}</div>
                        </div>
                        <div class="vitrine-body">
                            <span class="vitrine-category">${t.category}</span>
                            <div class="vitrine-desc">${t.description}</div>
                        </div>
                        <div class="vitrine-footer">
                            <span class="vitrine-date">${dateStr}</span>
                            <button class="btn-print" data-id="${t.id}" aria-label="Imprimir Certificado de ${t.title}">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                                Certificado
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Asignar eventos de impresión a los nuevos botones
                document.querySelectorAll('.btn-print').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        printCertificate(id);
                    });
                });
            }

            function printCertificate(id) {
                const t = allTrophies.find(x => x.id === id);
                if(!t) return;

                const printDiv = document.getElementById('print-container');
                const dateObj = new Date(t.date);
                const formalDate = dateObj.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                printDiv.innerHTML = `
                    <div class="certificate-mode">
                        <h2>Trophy Vault Hall of Records</h2>
                        <h1>CERTIFICADO DE CONSAGRACIÓN</h1>
                        <p>Por la presente, la Bóveda de Trofeos certifica ante la historia que</p>
                        <div class="champion-name">${t.champion}</div>
                        <p>ha demostrado valor, habilidad y determinación, conquistando exitosamente:</p>
                        <h3>${t.title}</h3>
                        <p class="desc">"${t.description}"</p>
                        
                        <div class="cert-seal">${getMedalIcon(t.level)}</div>
                        
                        <div class="cert-date">Registrado oficialmente el día ${formalDate}</div>
                    </div>
                `;
                
                // Mostrar contenedor, imprimir, y luego limpiarlo
                printDiv.style.display = 'block';
                window.print();
                printDiv.style.display = 'none';
                printDiv.innerHTML = '';
            }

            // Listeners de búsqueda
            searchInput.addEventListener('input', (e) => {
                renderTrophies(e.target.value);
            });

            btnClear.addEventListener('click', () => {
                searchInput.value = '';
                renderTrophies('');
            });

            // Renderizado inicial
            renderTrophies(searchInput.value);
        });
    </script>
</body>
</html>
