<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Conocimiento - Archivo de Bitácoras</title>
    <meta name="description" content="Archivo de bitácoras de soporte y soluciones técnicas.">
    <!-- Estilos globales Cyberpunk -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .search-container {
            border: 4px solid var(--color-cyber-yellow);
            padding: 1.5rem;
            background: var(--color-cyber-black);
            display: flex;
            align-items: center;
            box-shadow: 8px 8px 0 var(--color-cyber-red);
            margin-bottom: 2rem;
        }

        .search-container label {
            font-size: 1.5rem;
            margin-right: 1rem;
            font-weight: 900;
            color: var(--color-cyber-red);
            animation: blink 1s step-end infinite;
        }

        .cyber-input {
            background: transparent;
            border: none;
            color: var(--color-cyber-cyan);
            font-family: var(--font-primary);
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            outline: none;
        }

        .cyber-input::placeholder {
            color: rgba(0, 240, 255, 0.4);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 4px dashed var(--color-cyber-red);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 900;
        }
        
        .log-id { 
            color: var(--color-cyber-black);
            background-color: var(--color-cyber-cyan);
            padding: 2px 10px;
        }

        .log-date {
            color: var(--color-cyber-yellow);
        }
        
        .log-body h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            color: var(--color-cyber-red);
        }
        
        .log-body p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .log-solution {
            background: rgba(255, 0, 60, 0.1);
            padding: 1rem 1.5rem;
            border-left: 6px solid var(--color-cyber-yellow);
        }
        
        .log-solution h4 { 
            margin-bottom: 0.5rem; 
            text-transform: uppercase; 
            font-size: 1rem;
            color: var(--color-cyber-cyan);
        }

        .no-results {
            border: 4px dashed var(--color-cyber-red);
            padding: 2rem;
            text-align: center;
            font-weight: 900;
            color: var(--color-cyber-red);
            background: var(--color-cyber-black);
        }
    </style>
</head>
<body class="page-conocimiento">
    <header role="banner">
        <nav class="nav-global" aria-label="Navegación principal del sistema">
            <div class="nav-global__brand" aria-hidden="true">MAIN_OS</div>
            <h2 class="sr-only">Menú de navegación</h2>
            <ul class="nav-global__list">
                <li><a href="index.html" class="nav-global__link">Inicio</a></li>
                <li><a href="diagnostico.html" class="nav-global__link">Diagnóstico</a></li>
                <li><a href="mantenimiento.html" class="nav-global__link">Mantenimiento</a></li>
                <li><a href="contacto.html" class="nav-global__link">Contacto</a></li>
                <li><a href="base-conocimiento.html" class="nav-global__link nav-global__link--active" aria-current="page">Base Conocimiento</a></li>
                <li><a href="os-recovery.html" class="nav-global__link">OS Recovery</a></li>
            </ul>
        </nav>
    </header>

    <main role="main" class="layout-centered">
        <div style="width: 100%; max-width: 900px;">
            <header style="margin-bottom: 2rem;">
                <h1 class="cyber-header" style="font-size: 2.5rem;">Archivo_De_<span class="cyber-text-accent">Bitácoras</span></h1>
                <p>Registros históricos de Operadores. Acceso Nivel 3 requerido.</p>
            </header>

            <section class="search-container">
                <label for="search-input">></label>
                <input type="text" id="search-input" class="cyber-input" placeholder="Ingrese código de error o síntoma_" autocomplete="off" aria-label="Buscar en la base de conocimientos">
            </section>

            <section class="feed-container" id="logs-feed" aria-live="polite">
                <!-- Las tarjetas se inyectan dinámicamente mediante JS -->
            </section>
        </div>
    </main>

    <!-- Lógica de Base de Conocimiento y Filtrado -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logsDatabase = [
                {
                    id: "ERR-0x80070057",
                    date: "2023-11-12",
                    symptom: "Windows Update falla repetidamente al descargar o instalar actualizaciones. Devuelve error de 'parámetros incorrectos'.",
                    solution: "Purga de la carpeta SoftwareDistribution. Pasos: 1. Detener el servicio wuauserv. 2. Renombrar C:\\Windows\\SoftwareDistribution a .old. 3. Reiniciar el servicio wuauserv para forzar la reestructuración."
                },
                {
                    id: "SYS-BSOD-099",
                    date: "2024-02-28",
                    symptom: "Pantalla azul (BSOD) con el mensaje IRQL_NOT_LESS_OR_EQUAL al someter el sistema a carga pesada (renders, juegos 3D).",
                    solution: "Anomalía de hardware o drivers. 1. Actualizar controladores de GPU usando DDU en modo seguro. 2. Revisar perfil XMP/EXPO en BIOS; si el sistema no es estable, reducir la frecuencia de la RAM en 200MHz."
                },
                {
                    id: "NET-DNS-02",
                    date: "2024-05-15",
                    symptom: "Fallo de conexión en navegadores devolviendo ERR_NAME_NOT_RESOLVED, a pesar de que el indicador de red muestra acceso a internet.",
                    solution: "Limpiar caché de resolución DNS y winsock. Ejecutar en terminal (Admin): 'ipconfig /flushdns', seguido de 'netsh winsock reset'. Configurar los adaptadores para usar DNS estables (ej. 8.8.8.8 y 8.8.4.4)."
                },
                {
                    id: "HW-DRV-001",
                    date: "2024-07-03",
                    symptom: "Disco duro secundario desaparece del administrador de dispositivos aleatoriamente tras reactivar el PC desde la suspensión.",
                    solution: "Deshabilitar la suspensión selectiva de discos duros. Ruta: Panel de Control > Opciones de Energía > Cambiar configuración del plan > Configuración avanzada > Disco duro > Apagar disco duro tras: NUNCA."
                },
                {
                    id: "ERR-0xC0000225",
                    date: "2024-08-20",
                    symptom: "El sistema no logra bootear. Muestra pantalla azul inicial indicando que un dispositivo requerido no está conectado o que los datos de configuración de arranque (BCD) faltan.",
                    solution: "Reconstruir BCD. Bootear con unidad USB de instalación > Reparar Equipo > Símbolo del Sistema. Ejecutar: bootrec /fixmbr, luego bootrec /fixboot, luego bootrec /scanos, y finalmente bootrec /rebuildbcd."
                }
            ];

            const feedContainer = document.getElementById('logs-feed');
            const searchInput = document.getElementById('search-input');

            const renderLogs = (logs) => {
                feedContainer.innerHTML = '';
                
                if (logs.length === 0) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results';
                    noResults.textContent = "QUERY_FAILED: No se hallaron registros coincidentes en la base de datos local.";
                    feedContainer.appendChild(noResults);
                    return;
                }

                logs.forEach(log => {
                    const article = document.createElement('article');
                    article.className = 'cyber-panel';
                    article.style.padding = '2rem';
                    article.innerHTML = `
                        <div class="log-header">
                            <span class="log-id">${log.id}</span>
                            <span class="log-date">TIMESTAMP: ${log.date}</span>
                        </div>
                        <div class="log-body">
                            <h3>Síntoma Reportado</h3>
                            <p>${log.symptom}</p>
                        </div>
                        <div class="log-solution">
                            <h4>Solución Ejecutada</h4>
                            <p>${log.solution}</p>
                        </div>
                    `;
                    feedContainer.appendChild(article);
                });
            };

            renderLogs(logsDatabase);

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = logsDatabase.filter(log => 
                    log.id.toLowerCase().includes(query) || 
                    log.symptom.toLowerCase().includes(query) ||
                    log.solution.toLowerCase().includes(query)
                );
                renderLogs(filtered);
            });
        });
    </script>
</body>
</html>
